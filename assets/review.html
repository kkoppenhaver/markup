<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markup review</title>
<link rel="stylesheet" href="https://esm.sh/tldraw@5.6.0/tldraw.css">
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
  "react-dom": "https://esm.sh/react-dom@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
  "tldraw": "https://esm.sh/tldraw@5.6.0?external=react,react-dom"
} }
</script>
<style>
  :root { --bar: 44px; --ink: #111; --chrome: #16161a; --chrome-2: #26262c; --fg: #e8e8ec; --dim: #9a9aa6; --hot: #ffd54a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c0c0f; color: var(--fg); font: 13px/1.3 system-ui, -apple-system, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--chrome); border-bottom: 1px solid #2a2a31; z-index: 20; }
  #bar .modes { display: flex; gap: 2px; background: var(--chrome-2); border-radius: 8px; padding: 3px; }
  #bar button { font: inherit; color: var(--fg); background: transparent; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  #bar button:hover { background: #33333b; }
  #bar .modes button[aria-pressed="true"] { background: var(--fg); color: var(--ink); font-weight: 600; }
  #bar kbd { font: 11px ui-monospace, Menlo, monospace; opacity: .55; margin-left: 5px; }
  #bar .spacer { flex: 1; }
  #bar .url { color: var(--dim); font: 12px ui-monospace, Menlo, monospace; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
  #bar .hint { color: var(--dim); font-size: 12px; }
  #bar .count { background: var(--hot); color: #111; border-radius: 999px; padding: 2px 8px; font-weight: 700; font-size: 11px; }
  #bar button.send { background: var(--hot); color: #111; font-weight: 700; }
  #bar button.send:hover { background: #ffe27a; }
  #bar button.send[disabled] { opacity: .5; cursor: wait; }
  #bar button.send kbd { opacity: .7; }
  #stage { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; background: #fff; }
  #page { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #canvas { position: absolute; inset: 0; }
  #canvas .tl-container { background: transparent !important; --color-background: transparent; }
  #canvas .tl-background { display: none; }
  body[data-mode="edit"] #canvas, body[data-mode="browse"] #canvas { pointer-events: none; }
  body[data-mode="edit"] #canvas .tlui-layout, body[data-mode="browse"] #canvas .tlui-layout { opacity: .35; }
  body[data-mode="edit"] #page { outline: 3px solid var(--hot); outline-offset: -3px; }
  body.rv-placing #stage, body.rv-placing #canvas .tl-container, body.rv-placing #canvas .tl-canvas { cursor: crosshair !important; }
  body.rv-placing #addBtn { background: var(--hot); color: var(--ink); font-weight: 700; }
  /* TL;DR panel */
  #tldr { position: fixed; right: 14px; bottom: 14px; width: 360px; max-width: calc(100vw - 28px); background: var(--chrome); border: 1px solid #2a2a31; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.45); z-index: 30; display: none; flex-direction: column; overflow: hidden; }
  #tldr.open { display: flex; }
  #tldr .head { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 8px 12px; border-bottom: 1px solid #2a2a31; font-weight: 600; }
  #tldr .head button { font: inherit; color: var(--dim); background: transparent; border: 0; cursor: pointer; }
  #tldr textarea { font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: transparent; border: 0; padding: 12px; min-height: 160px; resize: vertical; outline: none; }
  #tldr textarea::placeholder { color: #6b6b78; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--fg); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-weight: 600; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); background: #fff; z-index: 5; }
</style>
</head>
<body data-mode="draw">
  <div id="bar">
    <div class="modes" role="group" aria-label="Mode">
      <button type="button" data-mode="draw" aria-pressed="true">Draw<kbd>^1</kbd></button>
      <button type="button" data-mode="edit" aria-pressed="false">Edit copy<kbd>^2</kbd></button>
      <button type="button" data-mode="browse" aria-pressed="false">Browse<kbd>^3</kbd></button>
    </div>
    <span class="hint" id="hint">Draw, arrow, note, text. Press ` to flip between drawing and editing.</span>
    <span class="spacer"></span>
    <span class="url" id="urlLabel"></span>
    <span class="count" id="count" title="marks + edits">0</span>
    <button type="button" id="addBtn" title="Add a screenshot slot where you click next">+ Image</button>
    <button type="button" id="tldrBtn">TL;DR<kbd>^/</kbd></button>
    <button type="button" id="copyBtn" title="Copy the notes as markdown">Copy</button>
    <button type="button" id="clearBtn">Clear all</button>
    <button type="button" id="sendBtn" class="send">Send to Claude<kbd>⌘↩</kbd></button>
  </div>
  <div id="stage">
    <iframe id="page" title="Page under review"></iframe>
    <div id="loading">Loading the review layer</div>
    <div id="canvas"></div>
  </div>
  <aside id="tldr">
    <div class="head"><span>TL;DR for Claude</span><button type="button" id="tldrClose" aria-label="Close">✕</button></div>
    <textarea id="tldrText" placeholder="The big-picture note. What's working, what isn't, what to do next."></textarea>
  </aside>
  <div id="toast"></div>
  <input type="file" id="fileInput" accept="image/*" hidden>
  <script type="module" src="review.js"></script>
</body>
</html>
